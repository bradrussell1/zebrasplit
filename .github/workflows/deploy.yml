# Merge to main: apply migrations and deploy the Edge Functions. Needs the repository
# secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF (and SUPABASE_DB_PASSWORD for
# db push). The Anthropic key is never here: it lives in Supabase function secrets.
name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrations
        run: supabase db push
      - name: Edge Functions
        run: |
          supabase functions deploy receipt-parse --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy receipt-save --project-ref "$PROJECT_REF"
          supabase functions deploy send-invite --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy reset-otp --project-ref "$PROJECT_REF"
          supabase functions deploy push --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy purge-trip-media --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy revenuecat-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
