<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zebrasplit logo animation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
@keyframes zsGraze{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(14deg) translateY(6px)}}
@keyframes zsCloud{0%{transform:translateX(0)}100%{transform:translateX(30px)}}
.zs-graze{animation:zsGraze 2.2s ease-in-out infinite;transform-origin:50% 100%}
.zs-graze2{animation:zsGraze 2.6s ease-in-out .6s infinite;transform-origin:50% 100%}
@keyframes zsGraze{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.zs-cloud{animation:zsCloud 6s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.zs-graze,.zs-graze2,.zs-cloud{animation:none}}
</style>
</helmet>
<div role="img" aria-label="Zebrasplit logo animation: stripes rise, swirl into a winking zebra, then reveal a pasture of happy zebras" style="position: relative; width: 540px; height: 960px; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: #E2FF2B">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: {{pastureOp}}; transform: scale({{pastureScale}}); transition: {{tPasture}}; background: linear-gradient(180deg, #FFFFFF 0%, #FBF8F2 45%, #F6FFD3 100%)">
    <span style="position: absolute; right: 70px; top: 120px; width: 110px; height: 110px; border-radius: 999px; background: #E2FF2B"></span>
    <span class="zs-cloud" style="position: absolute; left: 50px; top: 170px; width: 130px; height: 40px; border-radius: 999px; background: #FFFFFF; box-shadow: 30px -16px 0 0 #FFFFFF"></span>
    <svg width="540" height="560" viewBox="0 0 540 560" aria-hidden="true" style="position: absolute; left: 0; bottom: 0">
      <path d="M0 60 Q90 20 190 46 T380 40 T540 50 V560 H0 Z" fill="#EEF5D4"></path>
      <path d="M0 200 Q140 170 300 196 T540 186 V560 H0 Z" fill="#E6F0C6"></path>
      <g stroke="#B9CF8C" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M60 120 l-8 -22 M60 120 l2 -26 M60 120 l12 -20"></path>
        <path d="M250 96 l-8 -20 M250 96 l2 -24 M250 96 l12 -18"></path>
        <path d="M470 130 l-8 -22 M470 130 l2 -26 M470 130 l12 -20"></path>
        <path d="M150 300 l-8 -22 M150 300 l2 -26 M150 300 l12 -20"></path>
        <path d="M400 330 l-8 -22 M400 330 l2 -26 M400 330 l12 -20"></path>
        <path d="M40 470 l-8 -22 M40 470 l2 -26 M40 470 l12 -20"></path>
        <path d="M500 480 l-8 -22 M500 480 l2 -26 M500 480 l12 -20"></path>
      </g>
      <g fill="#F7A8BC"><circle cx="120" cy="150" r="6"></circle><circle cx="330" cy="140" r="6"></circle><circle cx="230" cy="420" r="7"></circle><circle cx="490" cy="300" r="6"></circle><circle cx="80" cy="360" r="6"></circle></g>
    </svg>
    <span class="zs-graze2" style="position: absolute; left: 36px; top: 470px"><dc-import name="ZebraFull" mood="happy" outfit="glasses" size="146" hint-size="146px,151px"></dc-import></span>
    <span class="zs-graze" style="position: absolute; left: 196px; top: 456px"><dc-import name="ZebraFull" mood="happy" outfit="party" size="146" hint-size="146px,151px"></dc-import></span>
    <span class="zs-graze2" style="position: absolute; left: 356px; top: 470px"><dc-import name="ZebraFull" mood="happy" outfit="none" size="146" hint-size="146px,151px"></dc-import></span>
    <span class="zs-graze" style="position: absolute; left: 0px; top: 640px"><dc-import name="ZebraFull" mood="happy" outfit="shades,goggles" size="190" hint-size="190px,196px"></dc-import></span>
    <span class="zs-graze2" style="position: absolute; left: 175px; top: 656px"><dc-import name="ZebraFull" mood="happy" outfit="none" size="190" hint-size="190px,196px"></dc-import></span>
    <span class="zs-graze" style="position: absolute; left: 350px; top: 640px"><dc-import name="ZebraFull" mood="happy" outfit="beanie,hoodie" size="190" hint-size="190px,196px"></dc-import></span>
    <div style="position: absolute; left: 0; right: 0; top: 230px; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: {{wordOp}}; transform: translateY({{wordY}}px); transition: {{tWord}}">
      <span style="font-size: 54px; font-weight: 900; letter-spacing: -0.04em">zebrasplit</span>
      <span style="font-size: 22px; line-height: 1.2; font-weight: 800; text-align: center">Split the trip<br>Not the friendship</span>
    </div>
  </div>

  <sc-for list="{{stripes}}" as="s" hint-placeholder-count="6">
    <span style="position: absolute; left: {{s.left}}px; top: 430px; width: 52px; height: 560px; border-radius: 26px; background: #1D1A17; opacity: {{s.op}}; transform: {{s.tf}}; transition: {{s.tr}}"></span>
  </sc-for>

  <span style="position: absolute; left: 100px; top: 250px; opacity: {{headOp}}; transform: rotate({{headRot}}deg) scale({{headScale}}); transition: {{tHead}}">
    <dc-import name="ZebraFull" mood="{{headMood}}" outfit="none" size="340" hint-size="340px,351px"></dc-import>
  </span>

  <sc-if value="{{controls}}" hint-placeholder-val="{{ true }}">
  <button type="button" onClick="{{replay}}" aria-label="Replay animation" style="position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; border: none; border-radius: 999px; background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1A17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4h4"></path></svg>
  </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () { self.setState({ t: (self.state.t + 100) % 8000 }); }, 100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var self = this;
    var t = this.state.t;
    // phases: 0 reset · 1 rise (300ms) · 2 swirl in (1500) · 3 wink (2700) · 4 swirl out + pasture (3700) · 5 wordmark (4600)
    var p = t < 300 ? 0 : t < 1500 ? 1 : t < 2700 ? 2 : t < 3700 ? 3 : t < 4600 ? 4 : 5;
    var reset = p === 0;
    var ease = 'cubic-bezier(.2,.8,.2,1)';
    var lefts = [40, 120, 200, 288, 368, 448];
    var stripes = lefts.map(function (l, k) {
      var cx = l + 26, cy = 430 + 280;
      var dx = 270 - cx, dy = 410 - cy;
      var tf, op;
      if (p === 0) { tf = 'translateY(620px) rotate(10deg)'; op = 1; }
      else if (p === 1) { tf = 'translateY(0) rotate(10deg)'; op = 1; }
      else { tf = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (540 + k * 30) + 'deg) scale(0.05)'; op = 0; }
      var tr = reset ? 'none' : (p === 1 ? 'transform 900ms ' + ease + ' ' + (k * 70) + 'ms' : 'transform 1000ms ' + ease + ' ' + (k * 40) + 'ms, opacity 700ms ease 400ms');
      return { left: l, tf: tf, op: op, tr: tr };
    });
    var headIn = p === 2 || p === 3;
    var headOut = p >= 4;
    return {
      stripes: stripes,
      headOp: headIn ? 1 : 0,
      headRot: headIn ? 0 : (headOut ? 360 : -360),
      headScale: headIn ? 1 : (headOut ? 7 : 0.05),
      tHead: reset ? 'none' : (headOut ? 'transform 1000ms cubic-bezier(.6,0,.4,1), opacity 600ms ease 400ms' : 'transform 1000ms ' + ease + ' 400ms, opacity 300ms ease 400ms'),
      headMood: p === 3 ? 'wink' : 'happy',
      pastureOp: headOut ? 1 : 0,
      pastureScale: headOut ? 1 : 1.15,
      tPasture: reset ? 'none' : 'opacity 900ms ease 300ms, transform 1400ms ' + ease + ' 300ms',
      wordOp: p === 5 ? 1 : 0,
      wordY: p === 5 ? 0 : 16,
      tWord: reset ? 'none' : 'opacity 600ms ease, transform 600ms ' + ease,
      controls: this.props.controls !== 'false',
      replay: function () { self.setState({ t: 0 }); }
    };
  }
}
</script>
</body>
</html>
