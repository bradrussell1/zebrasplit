<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip story: the dazzle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D1A17;text-decoration:none}a:hover{color:#3A3631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 22px 20px; display: flex; flex-direction: column; gap: 16px; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: radial-gradient(120% 55% at 100% 0%, #FFE9F3 0%, rgba(255,233,243,0) 60%), radial-gradient(100% 45% at 0% 22%, #F6FFD3 0%, rgba(246,255,211,0) 55%), linear-gradient(180deg, #FFFFFF 0%, #FBF8F2 50%, #F5F0E7 100%)">

  <div aria-label="Chapter 1 of 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 13px; font-weight: 700">Cabo 2026 · Trip story</span>
    <button type="button" aria-label="Close story" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1A17" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6E6A63">Chapter 1 · The dazzle</span>
    <h1 style="margin: 0; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Six zebras. Four nights. One villa.</h1>
    <span style="font-size: 14px; color: #6E6A63">Mar 12 – 16 · Cabo San Lucas · 23 expenses</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{herd}}" as="z" hint-placeholder-count="6">
      <div style="border-radius: 22px; background: #FFFFFF; padding: 12px 8px 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
        <dc-import name="Zebra" mood="{{z.mood}}" outfit="{{z.outfit}}" size="72" hint-size="72px,84px"></dc-import>
        <span style="font-size: 15px; font-weight: 800">{{z.name}}</span>
        <span style="font-size: 12px; line-height: 1.3; color: #6E6A63">{{z.fact}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <span style="padding: 8px 12px; border-radius: 999px; background: #1D1A17; color: #FFFBF2; font-size: 13px; font-weight: 700">6 of 6 Zebras earned their stripes</span>
  </div>

  <div style="flex: 1"></div>
  <a href="Story2.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #1D1A17; color: #FFFBF2; font-size: 16px; font-weight: 800">See the Damage
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2FF2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      herd: [
        { name: 'Apollo', mood: 'happy', outfit: 'shades,lei', fact: 'Started the dazzle' },
        { name: 'Jen', mood: 'starry', outfit: 'none', fact: 'Booked the villa' },
        { name: 'Mike', mood: 'wink', outfit: 'none', fact: 'Arrived Saturday' },
        { name: 'Priya', mood: 'happy', outfit: 'glasses', fact: 'Scanned 14 receipts' },
        { name: 'Sam', mood: 'love', outfit: 'party', fact: 'Bought one (1) churro' },
        { name: 'Dev', mood: 'sleepy', outfit: 'none', fact: 'Last to tap Done' }
      ]
    };
  }
}
</script>
</body>
</html>
