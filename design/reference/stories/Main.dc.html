<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home with shop entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D1A17;text-decoration:none}a:hover{color:#3A3631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 18px 22px 18px; display: flex; flex-direction: column; gap: 14px; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: radial-gradient(120% 55% at 100% 0%, #FFE9F3 0%, rgba(255,233,243,0) 60%), radial-gradient(100% 45% at 0% 22%, #F6FFD3 0%, rgba(246,255,211,0) 55%), linear-gradient(180deg, #FFFFFF 0%, #FBF8F2 50%, #F5F0E7 100%)">

  <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 6px">
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.03em">zebrasplit</span>
    <div style="display: flex; gap: 8px">
      <a href="#search" aria-label="Search" style="width: 48px; height: 48px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(29,26,23,0.06)">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1D1A17" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      </a>
      <a href="Shop.dc.html" aria-label="Shop" style="position: relative; width: 48px; height: 48px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(29,26,23,0.06)">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1D1A17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
        <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 999px; background: #FF4FA3; border: 2px solid #FFFFFF"></span>
      </a>
      <a href="Account.dc.html" aria-label="Your account" style="width: 48px; height: 48px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(29,26,23,0.06)">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1D1A17" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.8 20c1.2-3.6 4-5.4 7.2-5.4s6 1.8 7.2 5.4"></path></svg>
      </a>
    </div>
  </div>

  <div style="position: relative; overflow: hidden; border-radius: 30px; background: rgba(255,255,255,0.75); padding: 20px 20px 18px 20px; height: 196px; box-sizing: border-box; box-shadow: 0 6px 18px rgba(29,26,23,0.05)">
    <div style="font-size: 15px; color: #6E6A63">Across 2 Dazzles</div>
    <div style="margin-top: 4px; font-size: 48px; font-weight: 800; letter-spacing: -0.04em">$397.49</div>
    <div style="margin-top: 8px; width: 62%; height: 8px; border-radius: 999px; background: #FFE4F1"></div>
    <div style="margin-top: 12px; display: inline-block; padding: 7px 14px; border-radius: 999px; background: #FFE4F1; color: #A3195F; font-size: 15px; font-weight: 800">you owe</div>
    <span style="position: absolute; right: -6px; bottom: -14px">
      <dc-import name="Zebra" mood="worried" outfit="none" size="118" hint-size="118px,138px"></dc-import>
    </span>
  </div>

  <a href="Shop.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 999px; background: #1D1A17; color: #FFFBF2">
    <span style="width: 44px; height: 44px; border-radius: 999px; background: #FFF3F8; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0">
      <dc-import name="Zebra" mood="wink" outfit="goggles" size="38" hint-size="38px,44px"></dc-import>
    </span>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.25">
      <span style="font-size: 14px; font-weight: 700">New drop: Ski week pack</span>
      <span style="font-size: 12px; color: #E8E2D8">Goggles, beanie and a cocoa mug</span>
    </span>
    <span style="padding: 6px 12px; border-radius: 999px; background: #E2FF2B; color: #1D1A17; font-size: 13px; font-weight: 800">Shop</span>
  </a>

  <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 4px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.035em">Your Dazzles</h1>
    <div role="tablist" aria-label="Open or past dazzles" style="display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #F3EFE8">
      <button type="button" role="tab" aria-selected="true" style="min-height: 38px; padding: 0 16px; border: none; border-radius: 999px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #1D1A17">Open</button>
      <button type="button" role="tab" aria-selected="false" style="min-height: 38px; padding: 0 16px; border: none; border-radius: 999px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #6E6A63">Past</button>
    </div>
  </div>

  <sc-for list="{{trips}}" as="t" hint-placeholder-count="2">
    <div style="border-radius: 22px; background: #FFFFFF; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div><div style="font-size: 17px; font-weight: 700">{{t.name}}</div><div style="font-size: 12px; color: #6E6A63">{{t.meta}}</div></div>
        <span style="padding: 4px 10px; border-radius: 999px; background: #FFE4F1; color: #A3195F; font-size: 13px; font-weight: 700">{{t.amount}}</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 16px; background: #FAF7F2">
        <div style="display: flex; align-items: flex-end">
          <sc-for list="{{t.herd}}" as="z" hint-placeholder-count="6">
            <span style="width: 34px; height: 38px; margin-right: -6px; opacity: {{z.op}}; display: flex; align-items: flex-end">
              <dc-import name="Zebra" mood="{{z.mood}}" outfit="{{z.outfit}}" size="34" hint-size="34px,40px"></dc-import>
            </span>
          </sc-for>
        </div>
        <span style="font-size: 12px; font-weight: 700">{{t.done}}</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var z = function (mood, outfit, done) { return { mood: mood, outfit: outfit, op: done ? 1 : 0.45 }; };
    return {
      trips: [
        { name: 'Austin birthday', meta: 'Oct 9 – 12 · 6 zebras', amount: '−$254.99', done: '4 of 6 striped',
          herd: [z('worried', 'shades,lei', true), z('happy', 'none', true), z('happy', 'bucket', true), z('hi', 'none', false), z('happy', 'party', true), z('hi', 'none', false)] },
        { name: 'Big Sur weekend', meta: 'Oct 17 – 19 · 4 zebras', amount: '−$142.50', done: '1 of 4 striped',
          herd: [z('worried', 'shades,lei', false), z('happy', 'beanie', true), z('hi', 'none', false), z('hi', 'none', false)] }
      ]
    };
  }
}
</script>
</body>
</html>
