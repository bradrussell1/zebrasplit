<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TikTok trip video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
@keyframes zsBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.zs-bob{animation:zsBob 1.4s ease-in-out infinite}
.zs-bob2{animation:zsBob 1.4s ease-in-out .35s infinite}
@media (prefers-reduced-motion: reduce){.zs-bob,.zs-bob2{animation:none}}
</style>
</helmet>
<div role="img" aria-label="Animated TikTok recap of Cabo 2026" style="position: relative; width: 540px; height: 960px; overflow: hidden; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: #E2FF2B">

  <div aria-hidden="true" style="position: absolute; left: -40px; right: -40px; bottom: 0; height: 230px; display: flex; gap: 22px; transform: skewX(-10deg) translateY({{bandY}}px); transition: transform 700ms cubic-bezier(.2,.8,.2,1)">
    <span style="flex: 1; background: #1D1A17; border-radius: 18px 18px 0 0"></span><span style="flex: 1"></span><span style="flex: 1; background: #1D1A17; border-radius: 18px 18px 0 0"></span><span style="flex: 1"></span><span style="flex: 1; background: #1D1A17; border-radius: 18px 18px 0 0"></span><span style="flex: 1"></span><span style="flex: 1; background: #1D1A17; border-radius: 18px 18px 0 0"></span><span style="flex: 1"></span><span style="flex: 1; background: #1D1A17; border-radius: 18px 18px 0 0"></span><span style="flex: 1"></span><span style="flex: 1; background: #1D1A17; border-radius: 18px 18px 0 0"></span>
  </div>

  <span style="position: absolute; left: 34px; top: 76px; font-size: 22px; font-weight: 800; letter-spacing: -0.03em">zebrasplit</span>

  <div style="position: absolute; left: 34px; right: 68px; top: 150px; display: flex; flex-direction: column; gap: 14px; opacity: {{a.op}}; transform: translateY({{a.y}}px); transition: opacity 400ms ease, transform 600ms cubic-bezier(.2,.8,.2,1)">
    <span style="align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: #1D1A17; color: #E2FF2B; font-size: 14px; font-weight: 800; letter-spacing: 0.06em">CABO 2026 · 6 ZEBRAS · 4 NIGHTS</span>
    <span style="font-size: 64px; line-height: 0.92; font-weight: 900; letter-spacing: -0.05em">Six zebras.<br>One villa.<br>Zero museums.</span>
  </div>

  <div style="position: absolute; left: 34px; right: 68px; top: 170px; display: flex; flex-direction: column; gap: 6px; opacity: {{b.op}}; transform: translateY({{b.y}}px); transition: opacity 400ms ease, transform 600ms cubic-bezier(.2,.8,.2,1)">
    <span style="font-size: 26px; font-weight: 800">The damage</span>
    <span style="font-size: 112px; line-height: 0.9; font-weight: 900; letter-spacing: -0.06em">{{count}}</span>
    <span style="align-self: flex-start; margin-top: 10px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; font-size: 20px; font-weight: 800">$1,307 per zebra</span>
  </div>

  <div style="position: absolute; left: 34px; right: 68px; top: 170px; display: flex; flex-direction: column; gap: 12px; opacity: {{c.op}}; transition: opacity 400ms ease">
    <sc-for list="{{pills}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px; border-radius: 999px; background: {{p.bg}}; font-size: 30px; font-weight: 900; opacity: {{p.op}}; transform: translateX({{p.x}}px); transition: opacity 400ms ease {{p.delay}}ms, transform 600ms cubic-bezier(.2,.8,.2,1) {{p.delay}}ms"><span>{{p.label}}</span><span>{{p.val}}</span></div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 34px; right: 68px; top: 160px; display: flex; flex-direction: column; gap: 18px; opacity: {{d.op}}; transform: translateY({{d.y}}px); transition: opacity 400ms ease, transform 600ms cubic-bezier(.2,.8,.2,1)">
    <span style="font-size: 44px; line-height: 0.95; font-weight: 900; letter-spacing: -0.04em">Everyone paid once.<br>Nobody's mad.</span>
    <div style="display: flex; align-items: flex-end">
      <sc-for list="{{herd}}" as="z" hint-placeholder-count="6">
        <span class="{{z.cls}}" style="margin-right: -10px"><dc-import name="Zebra" mood="{{z.mood}}" outfit="{{z.outfit}}" size="80" hint-size="80px,93px"></dc-import></span>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="padding: 8px 14px; border-radius: 999px; background: #1D1A17; color: #FFFBF2; font-size: 17px; font-weight: 800">The Treasurer: Jen</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; font-size: 17px; font-weight: 800">The Houdini: Dev</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; font-size: 17px; font-weight: 800">Nickel &amp; Dimer: Sam</span>
    </div>
  </div>

  <sc-if value="{{outro}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0">
      <dc-import name="LogoAnim" controls="false" hint-size="540px,960px"></dc-import>
    </div>
  </sc-if>

  <div style="position: absolute; left: 34px; right: 68px; top: 60px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; opacity: {{barsOp}}">
    <sc-for list="{{ticks}}" as="tk" hint-placeholder-count="5">
      <span style="height: 3px; border-radius: 999px; background: {{tk.c}}"></span>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0 }; }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () { self.setState({ t: (self.state.t + 100) % 20000 }); }, 100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var t = this.state.t;
    // A 0–3s headline · B 3–6s damage count-up · C 6–9.5s pills · D 9.5–12s herd · E 12–20s logo outro
    var s = t < 3000 ? 0 : t < 6000 ? 1 : t < 9500 ? 2 : t < 12000 ? 3 : 4;
    var lay = function (k) { return { op: s === k ? 1 : 0, y: s === k ? 0 : (s < k ? 30 : -30) }; };
    var prog = Math.min(1, Math.max(0, (t - 3200) / 1300));
    var eased = 1 - Math.pow(1 - prog, 3);
    var n = Math.round(7842 * eased);
    var count = '$' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    var pillOn = s === 2;
    var pill = function (label, val, bg, k) { return { label: label, val: val, bg: bg, op: pillOn ? 1 : 0, x: pillOn ? 0 : -60, delay: pillOn ? k * 450 : 0 }; };
    return {
      a: lay(0), b: lay(1), c: { op: s === 2 ? 1 : 0 }, d: lay(3),
      count: count,
      pills: [pill('Villa', '$3,600', '#FFFFFF', 0), pill('Tequila', '14%', '#FF9F43', 1), pill('Museums', '0%', '#FFFFFF', 2)],
      herd: [
        { mood: 'happy', outfit: 'shades,lei', cls: 'zs-bob' }, { mood: 'starry', outfit: 'none', cls: 'zs-bob2' }, { mood: 'wink', outfit: 'none', cls: 'zs-bob' },
        { mood: 'happy', outfit: 'glasses', cls: 'zs-bob2' }, { mood: 'love', outfit: 'party', cls: 'zs-bob' }, { mood: 'sleepy', outfit: 'none', cls: 'zs-bob2' }
      ],
      outro: s === 4,
      bandY: s === 4 ? 260 : 0,
      barsOp: s === 4 ? 0 : 1,
      ticks: [0, 1, 2, 3, 4].map(function (k) { return { c: k <= s ? '#1D1A17' : 'rgba(29,26,23,0.2)' }; })
    };
  }
}
</script>
</body>
</html>
