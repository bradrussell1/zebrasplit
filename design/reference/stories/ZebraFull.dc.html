<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["hi","happy","wink","starry","love","sleepy","worried"],"default":"starry"},"outfit":{"editor":"text","default":"none"},"striped":{"editor":"boolean","default":true},"size":{"editor":"int","default":240,"min":40,"max":600},"$preview":{"width":240,"height":268}}'>
class Component extends DCLogic {
  renderVals() {
    var mood = this.props.mood || 'happy';
    var outfit = this.props.outfit || 'none';
    var list = String(outfit).split(',').map(function (s) { return s.trim(); });
    var has = function (id) { return list.indexOf(id) >= 0; };
    var w = Number(this.props.size || 240);
    var on = function (b) { return b ? 1 : 0; };
    var big = mood === 'happy' || mood === 'starry' || mood === 'love';
    var striped = !(this.props.striped === false || this.props.striped === 'false');
    return {
      w: w,
      h: Math.round(w * 380 / 340),
      label: 'Zebra' + (outfit !== 'none' ? ' wearing ' + list.join(' and ') : ''),
      stripe: striped ? '#1D1A17' : '#EFE8DC',
      cheekRx: big ? 12 : 10, cheekRy: big ? 7.5 : 6.5,
      eGlossyL: on(mood === 'hi' || mood === 'wink'), eGlossyR: on(mood === 'hi'),
      eArcL: on(mood === 'happy'), eArcR: on(mood === 'happy' || mood === 'wink'),
      eStar: on(mood === 'starry'), eLove: on(mood === 'love'), eSleepy: on(mood === 'sleepy'), eWorried: on(mood === 'worried'),
      oGlasses: on(has('glasses')), oShades: on(has('shades')), oHearts: on(has('hearts')), oGoggles: on(has('goggles')),
      oBucket: on(has('bucket')), oBeanie: on(has('beanie')), oParty: on(has('party')), oCrown: on(has('crown')), oTiara: on(has('tiara')),
      oTee: on(has('tee')), oHoodie: on(has('hoodie')), oScarf: on(has('scarf')), oChain: on(has('chain')), oSash: on(has('sash')),
      oBride: on(has('bride')), oLei: on(has('lei'))
    };
  }
}
</script>
