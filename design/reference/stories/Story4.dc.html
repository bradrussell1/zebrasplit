<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip story: the final split</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D1A17;text-decoration:none}a:hover{color:#3A3631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 22px 20px; display: flex; flex-direction: column; gap: 12px; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: radial-gradient(120% 55% at 100% 0%, #FFE9F3 0%, rgba(255,233,243,0) 60%), radial-gradient(100% 45% at 0% 22%, #F6FFD3 0%, rgba(246,255,211,0) 55%), linear-gradient(180deg, #FFFFFF 0%, #FBF8F2 50%, #F5F0E7 100%)">

  <div aria-label="Chapter 4 of 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 13px; font-weight: 700">Cabo 2026 · Trip story</span>
    <button type="button" aria-label="Close story" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1A17" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6E6A63">Chapter 4 · The final split</span>
    <h1 style="margin: 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.04em">Payment summary. Settled up in 2 days.</h1>
  </div>

  <div style="border-radius: 22px; background: #FFFFFF; padding: 6px 12px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #F0EBE2">
        <dc-import name="Zebra" mood="{{r.mood}}" outfit="{{r.outfit}}" size="34" hint-size="34px,40px"></dc-import>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 14px; font-weight: 800">{{r.name}}</span>
          <span style="font-size: 12px; color: #6E6A63">Paid {{r.paid}} · Share {{r.share}}</span>
        </span>
        <span style="padding: 4px 10px; border-radius: 999px; background: {{r.pillBg}}; color: {{r.pillFg}}; font-size: 13px; font-weight: 800">{{r.net}}</span>
      </div>
    </sc-for>
  </div>

  <div style="border-radius: 22px; background: #1D1A17; color: #FFFBF2; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #E8E2D8">Payments · one each</span>
    <sc-for list="{{pays}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px">
        <span style="font-weight: 700">{{p.from}} → Jen</span>
        <span style="display: flex; align-items: center; gap: 8px">
          <span style="font-weight: 800">{{p.amt}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E2FF2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Settled" role="img"><path d="M5 12l5 5L20 7"></path></svg>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <a href="Story5.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #1D1A17; color: #FFFBF2; font-size: 16px; font-weight: 800">Read the Tale of Cabo 2026
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2FF2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var row = function (name, mood, outfit, paid, share, net, plus) {
      return { name: name, mood: mood, outfit: outfit, paid: paid, share: share, net: net, pillBg: plus ? '#E2FF2B' : '#FFE4F1', pillFg: plus ? '#1D1A17' : '#A3195F' };
    };
    return {
      rows: [
        row('Jen', 'starry', 'none', '$4,718.80', '$1,318.15', '+$3,400.65', true),
        row('Apollo', 'happy', 'shades,lei', '$1,262.20', '$1,322.40', '−$60.20', false),
        row('Priya', 'happy', 'glasses', '$979.10', '$1,341.00', '−$361.90', false),
        row('Mike', 'wink', 'none', '$512.40', '$1,108.90', '−$596.50', false),
        row('Dev', 'sleepy', 'none', '$300.00', '$1,366.25', '−$1,066.25', false),
        row('Sam', 'love', 'party', '$69.80', '$1,385.60', '−$1,315.80', false)
      ],
      pays: [
        { from: 'Sam', amt: '$1,315.80' },
        { from: 'Dev', amt: '$1,066.25' },
        { from: 'Mike', amt: '$596.50' },
        { from: 'Priya', amt: '$361.90' },
        { from: 'Apollo', amt: '$60.20' }
      ]
    };
  }
}
</script>
</body>
</html>
