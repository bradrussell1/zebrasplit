<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip story: the damage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D1A17;text-decoration:none}a:hover{color:#3A3631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 22px 20px; display: flex; flex-direction: column; gap: 14px; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: radial-gradient(120% 55% at 100% 0%, #FFE9F3 0%, rgba(255,233,243,0) 60%), radial-gradient(100% 45% at 0% 22%, #F6FFD3 0%, rgba(246,255,211,0) 55%), linear-gradient(180deg, #FFFFFF 0%, #FBF8F2 50%, #F5F0E7 100%)">

  <div aria-label="Chapter 2 of 5" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 13px; font-weight: 700">Cabo 2026 · Trip story</span>
    <button type="button" aria-label="Close story" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1A17" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6E6A63">Chapter 2 · The damage</span>
    <div style="font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -0.045em">$7,842.30</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="padding: 6px 10px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700">$1,307.05 per zebra</span>
      <span style="padding: 6px 10px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700">$1,960.58 per day</span>
    </div>
  </div>

  <div role="img" aria-label="Spend by category" style="display: flex; gap: 3px; height: 28px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <span style="flex: {{c.flex}} 1 0; border-radius: 8px; background: {{c.barColor}}; opacity: {{c.op}}; transition: opacity 200ms ease"></span>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <div style="border-radius: 18px; background: #FFFFFF; overflow: hidden; box-shadow: {{c.ring}}">
        <button type="button" onClick="{{c.toggle}}" aria-expanded="{{c.expanded}}" style="width: 100%; min-height: 46px; padding: 8px 12px; border: none; background: transparent; font-family: inherit; display: flex; align-items: center; gap: 10px; text-align: left; color: #1D1A17; cursor: pointer">
          <span style="width: 14px; height: 14px; border-radius: 5px; background: {{c.barColor}}; flex-shrink: 0"></span>
          <span style="flex: 1; font-size: 15px; font-weight: 700">{{c.name}}</span>
          <span style="font-size: 13px; font-weight: 600; color: #6E6A63">{{c.pct}}</span>
          <span style="font-size: 15px; font-weight: 800; min-width: 84px; text-align: right">{{c.amount}}</span>
        </button>
        <sc-if value="{{c.open}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 12px 10px 36px; display: flex; flex-direction: column; gap: 4px">
            <sc-for list="{{c.lines}}" as="l" hint-placeholder-count="3">
              <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #3A3631"><span>{{l.what}}</span><span style="font-weight: 700">{{l.amt}}</span></div>
            </sc-for>
            <span style="font-size: 12px; color: #6E6A63">{{c.more}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 14px; border-radius: 18px; background: #1D1A17; color: #FFFBF2; font-size: 14px; line-height: 1.4"><b style="color: #E2FF2B">The Tequila Index:</b> 14% of the trip went to alcohol. 0% went to museums.</div>

  <div style="flex: 1"></div>
  <a href="Story3.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #1D1A17; color: #FFFBF2; font-size: 16px; font-weight: 800">See Awards
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2FF2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 'Alcohol' }; }
  renderVals() {
    var self = this;
    var data = [
      { name: 'Travel', amount: '$3,600.00', pct: '46%', flex: 45.9, color: '#1D1A17', more: 'Split by nights · Mike paid for 3',
        lines: [{ what: 'Villa, 4 nights · Jen', amt: '$3,600.00' }] },
      { name: 'Dining', amount: '$1,684.00', pct: '21%', flex: 21.5, color: '#FF4FA3', more: '+ 6 more meals',
        lines: [{ what: 'Mariscos dinner · Jen', amt: '$412.80' }, { what: 'Taco crawl, day 2 · Priya', amt: '$186.40' }, { what: 'One (1) churro · Sam', amt: '$2.75' }] },
      { name: 'Alcohol', amount: '$1,102.00', pct: '14%', flex: 14.1, color: '#FF9F43', more: '+ 11 more rounds',
        lines: [{ what: 'Tequila, 2 bottles · Mike', amt: '$240.00' }, { what: 'Boat bar tab · Jen', amt: '$186.00' }, { what: 'Margarita tower · Apollo', amt: '$96.00' }] },
      { name: 'Recreation', amount: '$720.00', pct: '9%', flex: 9.2, color: '#9B7BFF', more: 'Culture, observed from a boat',
        lines: [{ what: 'Boat charter · Jen', amt: '$520.00' }, { what: 'Snorkel gear · Dev', amt: '$200.00' }] },
      { name: 'Transportation', amount: '$486.00', pct: '6%', flex: 6.2, color: '#4DA3FF', more: '',
        lines: [{ what: 'Airport shuttles ×2 · Apollo', amt: '$260.00' }, { what: 'Rideshares ×9 · various', amt: '$226.00' }] },
      { name: 'Groceries', amount: '$250.30', pct: '3%', flex: 3.2, color: '#4CCB8F', more: '',
        lines: [{ what: 'Villa grocery run · Priya', amt: '$212.80' }, { what: 'Ice and limes · Sam', amt: '$37.50' }] }
    ];
    var cats = data.map(function (d) {
      var open = self.state.open === d.name;
      return {
        name: d.name, amount: d.amount, pct: d.pct, flex: d.flex, lines: d.lines, more: d.more,
        open: open, expanded: open ? 'true' : 'false',
        barColor: d.color,
        op: (!self.state.open || open) ? 1 : 0.3,
        ring: open ? '0 0 0 2px #1D1A17' : 'none',
        toggle: function () { self.setState({ open: open ? '' : d.name }); }
      };
    });
    return { cats: cats };
  }
}
</script>
</body>
</html>
