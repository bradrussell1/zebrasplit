<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wrapped: the money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1D1A17;text-decoration:none}a:hover{color:#3A3631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 22px 20px; display: flex; flex-direction: column; gap: 14px; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: radial-gradient(120% 55% at 100% 0%, #FFE9F3 0%, rgba(255,233,243,0) 60%), radial-gradient(100% 45% at 0% 22%, #F6FFD3 0%, rgba(246,255,211,0) 55%), linear-gradient(180deg, #FFFFFF 0%, #FBF8F2 50%, #F5F0E7 100%)">

  <div aria-label="Page 2 of 4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span><span style="height: 4px; border-radius: 999px; background: #E6E0D6"></span>
  </div>
  <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #6E6A63">WRAPPED · THE MONEY</span>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 16px; font-weight: 700">Your dazzles spent</span>
    <span style="font-size: 56px; line-height: 0.95; font-weight: 900; letter-spacing: -0.05em">$14,906.40</span>
    <span style="font-size: 14px; color: #6E6A63">across 4 trips, with 14 different zebras</span>
  </div>

  <div style="border-radius: 22px; background: #FFFFFF; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{trips}}" as="t" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 700">{{t.name}}</span><span style="font-weight: 800">{{t.amt}}</span></div>
        <div style="height: 12px; border-radius: 999px; background: #F3EFE8"><div style="width: {{t.pct}}; height: 12px; border-radius: 999px; background: {{t.color}}"></div></div>
      </div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="border-radius: 22px; background: #FFFFFF; padding: 14px"><div style="font-size: 13px; font-weight: 700; color: #6E6A63">You paid</div><div style="font-size: 28px; font-weight: 900; letter-spacing: -0.03em">$5,412.75</div></div>
    <div style="border-radius: 22px; background: #FFFFFF; padding: 14px"><div style="font-size: 13px; font-weight: 700; color: #6E6A63">Your share</div><div style="font-size: 28px; font-weight: 900; letter-spacing: -0.03em">$4,980.20</div></div>
  </div>

  <div style="border-radius: 22px; background: #1D1A17; color: #FFFBF2; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <span style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 999px; background: #FFF3F8; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <dc-import name="Zebra" mood="happy" outfit="shades,lei" size="46" hint-size="46px,54px"></dc-import>
    </span>
    <span style="font-size: 15px; line-height: 1.4">You fronted <b style="color: #E2FF2B">$432.55</b> more than your share, and every cent came back.</span>
  </div>

  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <span style="padding: 8px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700">Top category: Dining, 31%</span>
    <span style="padding: 8px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 700">Priciest day: Cabo boat day</span>
  </div>

  <div style="flex: 1"></div>
  <a href="Wrapped3.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #1D1A17; color: #FFFBF2; font-size: 16px; font-weight: 800">The Herd
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2FF2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      trips: [
        { name: 'Cabo 2026', amt: '$7,842.30', pct: '100%', color: '#E2FF2B' },
        { name: 'Nashville weekend', amt: '$3,104.10', pct: '40%', color: '#1D1A17' },
        { name: 'Tahoe cabin', amt: '$2,310.00', pct: '29%', color: '#1D1A17' },
        { name: 'Joshua Tree', amt: '$1,650.00', pct: '21%', color: '#1D1A17' }
      ]
    };
  }
}
</script>
</body>
</html>
