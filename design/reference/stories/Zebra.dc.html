<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["hi","happy","wink","starry","love","sleepy","worried"],"default":"happy"},"outfit":{"editor":"text","default":"none"},"size":{"editor":"int","default":200,"min":24,"max":400},"$preview":{"width":200,"height":264}}'>
class Component extends DCLogic {
  renderVals() {
    var mood = this.props.mood || 'happy';
    var outfit = this.props.outfit || 'none';
    var list = String(outfit).split(',').map(function (s) { return s.trim(); });
    var has = function (id) { return list.indexOf(id) >= 0; };
    var w = Number(this.props.size || 200);
    var on = function (b) { return b ? 1 : 0; };
    var big = mood === 'happy' || mood === 'starry' || mood === 'love';
    return {
      w: w,
      h: Math.round(w * 238 / 180),
      label: 'Zebra avatar' + (outfit !== 'none' ? ' wearing ' + list.join(' and ') : ''),
      cheekRx: big ? 12 : 10,
      cheekRy: big ? 7.5 : 6.5,
      eGlossyL: on(mood === 'hi' || mood === 'wink'),
      eGlossyR: on(mood === 'hi'),
      eArcL: on(mood === 'happy'),
      eArcR: on(mood === 'happy' || mood === 'wink'),
      eStar: on(mood === 'starry'),
      eLove: on(mood === 'love'),
      eSleepy: on(mood === 'sleepy'),
      eWorried: on(mood === 'worried'),
      oGlasses: on(has('glasses')), oShades: on(has('shades')), oHearts: on(has('hearts')), oGoggles: on(has('goggles')),
      oBucket: on(has('bucket')), oBeanie: on(has('beanie')), oParty: on(has('party')), oCrown: on(has('crown')), oTiara: on(has('tiara')),
      oTee: on(has('tee')), oHoodie: on(has('hoodie')), oScarf: on(has('scarf')), oChain: on(has('chain')), oSash: on(has('sash')),
      oBride: on(has('bride')), oLei: on(has('lei'))
    };
  }
}
</script>
