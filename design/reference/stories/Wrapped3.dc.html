<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wrapped: your herd and your look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1D1A17;text-decoration:none}a:hover{color:#3A3631}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 22px 20px; display: flex; flex-direction: column; gap: 14px; font-family: 'Figtree', system-ui, sans-serif; color: #1D1A17; background: #E2FF2B">

  <div aria-label="Page 3 of 4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: #1D1A17"></span><span style="height: 4px; border-radius: 999px; background: rgba(29,26,23,0.18)"></span>
  </div>
  <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em">WRAPPED · YOUR HERD</span>

  <h1 style="margin: 0; font-size: 40px; line-height: 0.95; font-weight: 900; letter-spacing: -0.045em">Jen is your<br>ride-or-die zebra.</h1>

  <div style="border-radius: 24px; background: #FFFFFF; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{herd}}" as="z" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 22px; font-size: 18px; font-weight: 900">{{z.rank}}</span>
        <dc-import name="Zebra" mood="{{z.mood}}" outfit="{{z.outfit}}" size="48" hint-size="48px,56px"></dc-import>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 16px; font-weight: 800">{{z.name}}</span>
          <span style="font-size: 12px; color: #6E6A63">{{z.note}}</span>
        </span>
        <span style="padding: 4px 10px; border-radius: 999px; background: #F3EFE8; font-size: 13px; font-weight: 800">{{z.trips}}</span>
      </div>
    </sc-for>
  </div>

  <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; padding-top: 4px">YOUR LOOK</span>
  <div style="border-radius: 24px; background: #1D1A17; color: #FFFBF2; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <span style="flex-shrink: 0; width: 110px; height: 110px; border-radius: 999px; background: #FFF3F8; display: flex; align-items: flex-end; justify-content: center; overflow: hidden">
      <dc-import name="Zebra" mood="happy" outfit="shades,lei" size="96" hint-size="96px,112px"></dc-import>
    </span>
    <span style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #E2FF2B">MOST WORN</span>
      <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.02em">Sunglasses + lei</span>
      <span style="font-size: 14px; color: #E8E2D8">On 3 of 4 dazzles. A signature look.</span>
    </span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="border-radius: 20px; background: #FFFFFF; padding: 12px 14px"><div style="font-size: 12px; font-weight: 700; color: #6E6A63">Your closet</div><div style="font-size: 22px; font-weight: 900">6 outfits</div></div>
    <div style="border-radius: 20px; background: #FFFFFF; padding: 12px 14px"><div style="font-size: 12px; font-weight: 700; color: #6E6A63">Best dressed in your herd</div><div style="font-size: 22px; font-weight: 900">Priya · 7 looks</div></div>
  </div>

  <div style="flex: 1"></div>
  <a href="Wrapped4.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 999px; background: #1D1A17; color: #FFFBF2; font-size: 16px; font-weight: 800">Your Zebra Type
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2FF2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      herd: [
        { rank: '1', name: 'Jen', mood: 'starry', outfit: 'none', note: 'Cabo, Nashville, Joshua Tree', trips: '3 trips' },
        { rank: '2', name: 'Mike', mood: 'wink', outfit: 'none', note: 'Cabo, Tahoe', trips: '2 trips' },
        { rank: '3', name: 'Priya', mood: 'happy', outfit: 'glasses', note: 'Cabo, Nashville', trips: '2 trips' }
      ]
    };
  }
}
</script>
</body>
</html>
